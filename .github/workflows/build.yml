name: Build Rmad APK

on: 
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # ✅ هذا هو الحل: تحديد البيئة الإصدارات القديمة المستقرة
    runs-on: ubuntu-22.04 
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip build-essential \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf \
          libportmidi-dev libfreetype6-dev libglew-dev \
          libjpeg-dev libtiff-dev libgstreamer1.0-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
            buildozer init
        fi
        # تحديث الإعدادات الأساسية لضمان عمل التطبيق
        sed -i 's/android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/title = .*/title = Rmad/' buildozer.spec
        # تأكد من تضمين ملفات اللغة والملفات الإضافية
        sed -i 's/source.include_exts = .*/source.include_exts = py,txt,jpg,png/' buildozer.spec

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rmad-APK
        path: bin/*.apk
