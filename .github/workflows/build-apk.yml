name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential libpython3.9-dev
        pip install --upgrade pip
        pip install buildozer cython
        sudo apt-get install -y git zip unzip openjdk-17-jdk

    - name: Initialize Buildozer
      run: |
        # Ensure buildozer.spec is present
        touch buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Rmad-APK
        path: bin/*.apk
