name: Build Rmad APK

on: 
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: # يسهل تشغيله يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10'] # استخدم 3.10 لضمان توافق أحدث Kivy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # أحدث نسخة

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # أحدث نسخة
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk
        sudo apt-get install -y python3-pip build-essential libpython3.10-dev
        # مكتبات Kivy الأساسية
        sudo apt-get install -y \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf \
          libportmidi-dev libfreetype6-dev libglew2.2 libglew-dev \
          libjpeg-dev libtiff-dev libgstreamer1.0-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer
      run: |
        # إذا لم يوجد ملف الإعداد، قم بإنشائه
        if [ ! -f buildozer.spec ]; then
            buildozer init
        fi
        # تأكد من الإعدادات
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec
        echo "title = Rmad" >> buildozer.spec
        echo "source.include_exts = py,txt,jpg,png" >> buildozer.spec

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # أحدث نسخة
      with:
        name: Rmad-APK
        path: bin/*.apk
