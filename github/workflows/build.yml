name: Build Rmad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # لبدء البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libssl-dev

    - name: Install Android SDK
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        sudo apt-get install -y wget
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512409_latest.zip
        unzip commandlinetools-linux-8512409_latest.zip
        mkdir -p $HOME/android-sdk
        mv cmdline-tools $HOME/android-sdk/
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
        yes | sdkmanager "platforms;android-33"
        yes | sdkmanager "build-tools;33.0.0"
        yes | sdkmanager "platform-tools"

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        buildozer android debug
        # Rename the output file to something recognizable
        mv bin/*.apk Rmad_App.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Rmad-APK
        path: Rmad_App.apk
